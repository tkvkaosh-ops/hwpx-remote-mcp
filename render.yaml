services:
  - type: web
    name: maesil-hwpx-mcp
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DOWNLOAD_SIGNING_KEY
        generateValue: true
      - key: HWPX_DOWNLOAD_TTL_SECONDS
        value: "900"
      - key: HWPX_MAX_UPLOAD_BYTES
        value: "10485760"
      - key: HWPX_MAX_UNCOMPRESSED_BYTES
        value: "33554432"
      - key: HWPX_MAX_XML_BYTES
        value: "8388608"
